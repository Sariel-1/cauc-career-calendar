<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f4f7f3"><title>校园宣讲日历</title><style>
:root{--bg:#f4f7f3;--ink:#263a30;--green:#466a50;--muted:#7c897f;--line:#e5ebe4;--pale:#e8efe2}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}button,select,a{font:inherit;color:inherit;-webkit-tap-highlight-color:transparent}button,select{cursor:pointer;border:0;background:transparent}button:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--green);outline-offset:-2px}[hidden]{display:none!important}.shell{max-width:740px;margin:auto;padding:0 10px calc(24px + env(safe-area-inset-bottom))}.nav{height:46px;display:grid;place-items:center;position:relative;color:#202620;font-weight:550}.back{position:absolute;left:0;font-size:26px;padding:0 12px}.hero{position:relative;margin:21px 0 23px}.eyebrow{font-size:10px;font-weight:750;letter-spacing:2.2px;color:#819a85}.hero h1{font-size:clamp(22px,5.5vw,28px);letter-spacing:-1px;margin:6px 0 0;line-height:1.35}.muted{color:var(--muted);margin:0}.pill{background:#edf2e6;color:#718568;border-radius:20px;padding:4px 9px;font-size:11px}.hero .pill{position:absolute;right:0;top:1px}.bar,.grid,.scroller,.filter{border:1px solid var(--line);background:#fff;border-radius:9px}.bar{display:flex;align-items:center;justify-content:space-between;gap:1px;padding:5px 4px}.switch{display:flex;background:#f3f5f1;border-radius:6px;padding:2px}.switch button{padding:5px 7px;color:var(--muted);border-radius:4px}.switch [aria-pressed=true]{background:var(--pale);color:var(--green);font-weight:bold}.arrow,.today{color:var(--green);min-height:34px;padding:2px 4px}.arrow{font-size:19px}.period{font-size:clamp(10px,3vw,14px);text-align:center;font-variant-numeric:tabular-nums}.today{font-size:13px}.filters{display:flex;gap:8px;margin:10px 0}.filter{font-size:13px;padding:7px;max-width:57%;color:#57665a}.scroller{overflow-x:auto;overscroll-behavior-x:contain}.week{display:grid;grid-template-columns:44px repeat(7,minmax(79px,1fr));width:max(100%,597px)}.week.day{grid-template-columns:44px 1fr;width:100%}.week>div{border-right:1px solid var(--line);padding:8px}.week .head{padding:14px 3px;background:#f8faf7;border-bottom:1px solid var(--line);text-align:center;white-space:nowrap;font-size:13px;font-weight:600}.week .current,.cell.current{background:#edf3e8;color:#45694b}.week .slot{min-height:136px;text-align:center;font-size:12px;color:#7d897f}.week .pane{padding:5px;min-width:0}.emptyday{font-size:10px;color:#a3aba2}.event{display:block;width:100%;border-radius:5px;text-align:left;background:#edf4e9;border-left:3px solid #849f7c;padding:5px;font-size:11px;line-height:1.5;margin:2px 0 5px;overflow-wrap:anywhere}.event b,.event span{display:block}.event small{color:#697c6b}.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));overflow:hidden}.weekday,.cell{padding:4px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);min-width:0}.weekday{text-align:center;background:#f8faf7;color:#6a796c;font-size:12px;padding:9px 0}.cell{min-height:64px;font-size:12px}.out{color:#a6afa6}.cell .event{font-size:10px;line-height:1.3;padding:2px;border-left-width:2px}.cell .event span{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.foot{text-align:center;font-size:11px;color:#879284;margin:14px 6px}.jobs button{margin:6px 0;font-size:14px}.jobs h2{font-size:16px}.detail{background:white;border:1px solid var(--line);padding:18px;border-radius:12px;margin-top:14px}.detail h1{font-size:23px;line-height:1.45;margin:12px 0}.row{padding:10px 0;border-bottom:1px solid var(--line);display:grid;grid-template-columns:72px 1fr;gap:6px}.label{color:#768377}.action{display:block;width:100%;background:#eaf1e7;text-decoration:none;padding:11px;border-radius:7px;text-align:center;color:var(--green);margin-top:10px}.action.primary{background:#496b51;color:white}
</style></head><body><main class="shell"><header class="nav"><button id="back" class="back" hidden aria-label="返回日历">‹</button><span id="navtitle">校园宣讲日历</span></header><section id="home"><div class="hero"><div class="eyebrow">CAMPUS CAREER EVENTS</div><span class="pill" id="sync">正在加载</span><h1>校招宣讲，一目了然</h1><p class="muted">按周或按月查看宣讲安排</p></div><div class="bar"><div class="switch" id="views"><button data-v="day">日</button><button data-v="week">周</button><button data-v="month">月</button></div><button class="arrow" id="prev" aria-label="上一期">‹</button><span class="period" id="period"></span><button class="arrow" id="next" aria-label="下一期">›</button><button id="today" class="today">今天</button></div><div class="filters"><select class="filter" id="unit" aria-label="单位"><option value="">全部单位</option></select><select class="filter" id="type" aria-label="类型"><option value="">全部类型</option></select></div><div id="cal"></div><section class="jobs" id="jobs"></section><p class="foot" id="note">活动安排以学校官方通知为准。</p></section><section id="detail" class="detail" hidden></section></main>
<script>'use strict';
const el=id=>document.getElementById(id), node=(tag,cls,txt)=>{const n=document.createElement(tag);n.className=cls||'';n.textContent=txt||'';return n};
const days='日一二三四五六',pad=n=>String(n).padStart(2,'0'),iso=d=>d.toISOString().slice(0,10);
function chinaDay(){return new Date(Date.now()+8*3600000).toISOString().slice(0,10)}
function add(d,n){return new Date(d.getTime()+n*86400000)}
function dates(d,v){if(v==='day')return [d];let first=v==='month'?new Date(Date.UTC(d.getUTCFullYear(),d.getUTCMonth(),1)):d;let start=add(first,-first.getUTCDay());let count=v==='week'?7:Math.ceil((first.getUTCDay()+new Date(Date.UTC(d.getUTCFullYear(),d.getUTCMonth()+1,0)).getUTCDate())/7)*7;return Array.from({length:count},(_,i)=>add(start,i))}
let anchor=new Date(chinaDay()+'T12:00:00Z'),view='week',events=[],loaded=false;
function company(e){return e.company||((e.type==='宣讲会'&&e.title.replace(/(?:20\d{2}届)?(?:校园招聘)?(?:校园)?宣讲会.*$/,'').trim())||'')}
function options(id,label,values){const s=el(id),old=s.value;s.replaceChildren(new Option(label,''),...Array.from(new Set(values.filter(Boolean))).sort().map(x=>new Option(x,x)));if(Array.from(s.options).some(x=>x.value===old))s.value=old}
function card(e,mini){const b=node('button','event');b.append(node('b','',e.startTime||''),node('span','',e.title));if(!mini&&e.venue)b.append(node('small','',e.venue));b.onclick=()=>{location.hash='event='+encodeURIComponent(e.id)};return b}
function draw(){const range=dates(anchor,view),first=iso(range[0]),last=iso(range[range.length-1]),today=chinaDay(),a=iso(anchor);el('period').textContent=view==='week'?first+' — '+last:view==='day'?a+' · 周'+days[anchor.getUTCDay()]:a.slice(0,4)+'年'+Number(a.slice(5,7))+'月';
document.querySelectorAll('[data-v]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.v===view)));
const filtered=events.filter(e=>(!el('unit').value||el('unit').value===company(e))&&(!el('type').value||el('type').value===e.type));const month=view==='month',grid=node('div',month?'grid':'week '+view);
if(month){for(const w of days)grid.append(node('div','weekday',w))}else{grid.append(node('div','head'));for(const d of range)grid.append(node('div','head '+(iso(d)===today?'current':''),'周'+days[d.getUTCDay()]+' '+d.getUTCDate()+'日'));grid.append(node('div','slot','宣讲'))}
for(const d of range){const date=iso(d),cell=node('div',month?'cell '+(date===today?'current ':'')+(date.slice(0,7)!==a.slice(0,7)?'out':''):'pane');if(month)cell.append(node('span','',String(d.getUTCDate())));const items=filtered.filter(e=>e.date===date).sort((x,y)=>(x.startTime||'').localeCompare(y.startTime||''));for(const e of items)cell.append(card(e,month));if(!month&&!items.length)cell.append(node('span','emptyday',loaded?'暂无安排':'…'));grid.append(cell)}
const wrap=node('div',month?'':'scroller');wrap.append(grid);el('cal').replaceChildren(wrap);const jobs=filtered.filter(e=>!e.date);el('jobs').replaceChildren(...(jobs.length?[node('h2','','校园招聘 · 无明确场次'),...jobs.map(e=>card(e,true))]:[]))}
function shift(n){anchor=view==='month'?new Date(Date.UTC(anchor.getUTCFullYear(),anchor.getUTCMonth()+n,1,12)):add(anchor,n*(view==='week'?7:1));draw()}
function stamp(date,time){return new Date(date+'T'+time+':00+08:00').toISOString().replace(/[-:]/g,'').replace(/\.\d{3}/,'')}
function esc(s){return String(s||'').replace(/\\/g,'\\\\').replace(/\r\n|\r|\n/g,'\\n').replace(/[,;]/g,c=>'\\'+c)}
function fold(s){let line='',bytes=0;const lines=[];for(const ch of s){const n=new TextEncoder().encode(ch).length;if(bytes+n>75){lines.push(line);line=' ';bytes=1}line+=ch;bytes+=n}lines.push(line);return lines.join('\r\n')}
function download(e){const lines=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Campus Career Calendar//ZH','BEGIN:VEVENT','UID:'+esc(e.id)+'@cauc-career-calendar','DTSTAMP:'+new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d{3}/,''),'DTSTART:'+stamp(e.date,e.startTime)];if(e.endTime&&e.endTime>e.startTime)lines.push('DTEND:'+stamp(e.date,e.endTime));lines.push('SUMMARY:'+esc(e.title),'LOCATION:'+esc(e.venue),'DESCRIPTION:'+esc(e.sourceUrl),'END:VEVENT','END:VCALENDAR');const url=URL.createObjectURL(new Blob([lines.map(fold).join('\r\n')+'\r\n'],{type:'text/calendar;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download=e.date+'-校园招聘.ics';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000)}

function source(box,title,raw,host){try{const u=new URL(raw);if(u.protocol!=='https:'||u.hostname!==host)return;const a=node('a','action',title);a.href=u.href;box.append(a)}catch{}}
function route(){const h=location.hash.slice(1);const show=h.startsWith('event=');el('back').hidden=!show;el('detail').hidden=!show;el('home').hidden=show;el('navtitle').textContent=show?'宣讲详情':'校园宣讲日历';if(!show)return;const e=events.find(x=>'event='+encodeURIComponent(x.id)===h);const box=el('detail');box.replaceChildren();if(!e){box.textContent=loaded?'暂未找到这场活动':'正在读取活动…';return}box.append(node('span','pill',e.type),node('h1','',e.title));for(const [k,v] of [['单位',company(e)],['北京时间',[e.date,e.startTime+(e.endTime?'–'+e.endTime:'')].filter(Boolean).join(' ')],['地点',e.venue]])if(v){const row=node('div','row');row.append(node('span','label',k),node('span','',v));box.append(row)}if(e.date&&e.startTime){const b=node('button','action primary','同步到手机日历');b.onclick=()=>download(e);box.append(b)}source(box,'查看学校官方通知',e.sourceUrl,'cauc.bysjy.com.cn');source(box,'阅读公众号原文',e.url,'mp.weixin.qq.com')}
el('views').onclick=e=>{if(e.target.dataset.v){view=e.target.dataset.v;draw()}};el('prev').onclick=()=>shift(-1);el('next').onclick=()=>shift(1);el('today').onclick=()=>{anchor=new Date(chinaDay()+'T12:00:00Z');draw()};el('type').onchange=el('unit').onchange=draw;el('back').onclick=()=>{history.replaceState(null,'',location.pathname+location.search);route()};window.addEventListener('hashchange',route);
async function refresh(){try{const r=await fetch('./events.json',{cache:'no-cache'});if(!r.ok)throw Error();const data=await r.json();if(!Array.isArray(data))throw Error();events=data.filter(e=>e&&e.id&&typeof e.title==='string');loaded=true;options('unit','全部单位',events.map(company));options('type','全部类型',events.map(e=>e.type));el('sync').textContent='学校就业网';el('note').textContent='活动安排以学校官方通知为准。';draw();route()}catch{el('sync').textContent='更新失败';el('note').textContent='无法更新学校活动，请稍后刷新。'}}draw();route();refresh();setInterval(()=>{if(!document.hidden)refresh()},300000);
</script></body></html>
