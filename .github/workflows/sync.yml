name: 中航大就业信息同步
on:
  workflow_dispatch:
  schedule:
    - cron: '17,47 * * * *'
permissions:
  actions: read
  contents: write
  pages: write
  id-token: write
concurrency:
  group: campus-calendar
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: github-pages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright && playwright install --with-deps chromium
      - run: python sync.py
      - run: |
          git add docs/events.json
          if ! git diff --cached --quiet; then
            git config user.name github-actions
            git config user.email github-actions@users.noreply.github.com
            git commit -m "更新就业网场次"
            git push
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - name: 等待 GitHub 能查到本次发布包
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in {1..12}; do
            if gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?name=github-pages" \
              --jq '.artifacts[] | select(.expired == false) | .id' | grep -q '[0-9]'; then
              exit 0
            fi
            sleep 5
          done
          echo "::error::等待本次发布包可见超时"
          exit 1

      - uses: actions/deploy-pages@v4
