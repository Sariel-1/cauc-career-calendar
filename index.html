<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>校园宣讲日历</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f6f2;color:#1b342e;font:16px/1.6 "Microsoft YaHei",system-ui,sans-serif}main{max-width:860px;margin:auto;padding:36px 18px}header{border-top:5px solid #24755b;padding:18px 0}h1{font-size:clamp(30px,6vw,48px);margin:0;letter-spacing:-.04em}header p{margin:0;color:#566961}.tools,.actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap}button,input,select,.link{font:inherit;padding:7px 12px;border:1px solid #bdcbc3;background:white;border-radius:7px;color:inherit}button,.link,summary{cursor:pointer}.link{text-decoration:none}button:hover,.link:hover{background:#e1eee6}.tools{margin:12px 0}#month{font-weight:bold}#status{color:#566961}details{border:1px solid #d6dfd8;background:white;border-radius:9px;margin:10px 0}summary{padding:14px;font-weight:600}summary small{display:block;font-weight:400;margin-left:18px;color:#44655a}.info{padding:0 16px 16px}.actions{margin-top:10px}.actions a:first-child{color:#12654c}input{max-width:100%}button:focus-visible,summary:focus-visible,a:focus-visible{outline:3px solid #529b84}footer{font-size:14px;color:#566961;margin-top:28px}
</style><main><header><p>中国民航大学就业信息网 · 活动汇总</p><h1>校园宣讲日历</h1></header>
<div class="tools"><button id="prev" aria-label="上个月">‹ 上月</button><label id="month"></label><button id="next" aria-label="下个月">下月 ›</button><button id="today">本月</button></div>
<div class="tools"><input id="query" type="search" placeholder="搜索单位、活动或地点" aria-label="搜索单位、活动或地点"><select id="type" aria-label="活动类型"><option value="">全部类型</option></select></div>
<p id="status" role="status">正在读取学校活动…</p><section id="list"></section><section id="jobs"></section><footer>时间均为北京时间。活动安排以学校官方通知为准。</footer></main><script>
'use strict';
const el=id=>document.getElementById(id);
const nowMonth=()=>new Intl.DateTimeFormat('sv-SE',{timeZone:'Asia/Shanghai',year:'numeric',month:'2-digit'}).format(new Date());
let month=nowMonth(), events=[];
function move(step){const [y,m]=month.split('-').map(Number);month=new Date(Date.UTC(y,m-1+step,1)).toISOString().slice(0,7);render()}
function element(tag,text){const node=document.createElement(tag);node.textContent=text;return node}
function link(box,label,raw,host){try{const u=new URL(raw);if(u.protocol!=='https:'||u.hostname!==host)return;const a=element('a',label);a.className='link';a.href=u.href;a.target='_blank';a.rel='noopener noreferrer';box.append(a)}catch{}}
function stamp(date,time){return new Date(date+'T'+time+':00+08:00').toISOString().replace(/[-:]/g,'').replace(/\.\d{3}/,'')}
function esc(s){return String(s||'').replace(/\\/g,'\\\\').replace(/\r\n|\r|\n/g,'\\n').replace(/[,;]/g,c=>'\\'+c)}
function fold(s){let line='',bytes=0;const lines=[];for(const ch of s){const n=new TextEncoder().encode(ch).length;if(bytes+n>75){lines.push(line);line=' ';bytes=1}line+=ch;bytes+=n}lines.push(line);return lines.join('\r\n')}
function download(e){const lines=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Campus Career Calendar//ZH','BEGIN:VEVENT','UID:'+esc(e.id)+'@cauc-career-calendar','DTSTAMP:'+new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d{3}/,''),'DTSTART:'+stamp(e.date,e.startTime)];if(e.endTime&&e.endTime>e.startTime)lines.push('DTEND:'+stamp(e.date,e.endTime));lines.push('SUMMARY:'+esc(e.title),'LOCATION:'+esc(e.venue),'DESCRIPTION:'+esc(e.sourceUrl),'END:VEVENT','END:VCALENDAR');const url=URL.createObjectURL(new Blob([lines.map(fold).join('\r\n')+'\r\n'],{type:'text/calendar;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download=e.date+'-校园招聘.ics';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000)}
function card(e){const d=document.createElement('details'),s=element('summary',e.title);s.append(element('small',[e.date,e.startTime,e.venue].filter(Boolean).join('　')||e.type));d.append(s);const info=element('div',[e.type,e.company].filter(Boolean).join(' · '));info.className='info';const a=element('div','');a.className='actions';link(a,'学校官方通知',e.sourceUrl,'cauc.bysjy.com.cn');link(a,'公众号原文',e.url,'mp.weixin.qq.com');if(e.date&&/^\d\d:\d\d$/.test(e.startTime)){const b=element('button','添加到日历（.ics）');b.onclick=()=>download(e);a.append(b)}info.append(a);d.append(info);return d}
function render(){el('month').textContent=month.replace('-',' 年 ')+' 月';const q=el('query').value.trim().toLowerCase(),t=el('type').value;const matches=events.filter(e=>(!t||e.type===t)&&[e.title,e.company,e.venue].join(' ').toLowerCase().includes(q));const dated=matches.filter(e=>e.date&&e.date.startsWith(month)).sort((a,b)=>(a.date+a.startTime).localeCompare(b.date+b.startTime));el('status').textContent=dated.length?'本月 '+dated.length+' 场活动，点击标题查看详情。':'当前月份和筛选条件下暂无活动。';el('list').replaceChildren(...dated.map(card));const jobs=matches.filter(e=>!e.date);el('jobs').replaceChildren(...(jobs.length?[element('h2','无明确场次的招聘'),...jobs.map(card)]:[]))}
el('prev').onclick=()=>move(-1);el('next').onclick=()=>move(1);el('today').onclick=()=>{month=nowMonth();render()};el('query').oninput=render;el('type').onchange=render;
async function load(){try{const r=await fetch('./events.json',{cache:'no-cache'});if(!r.ok)throw Error();const rows=await r.json();if(!Array.isArray(rows))throw Error();events=rows.filter(e=>e&&typeof e.title==='string');const sel=el('type'),prior=sel.value;sel.replaceChildren(new Option('全部类型',''),...Array.from(new Set(events.map(e=>e.type).filter(Boolean)),v=>new Option(v,v)));sel.value=prior;render()}catch{el('status').textContent='活动数据暂时无法更新，请稍后刷新。'}}
load();setInterval(()=>{if(!document.hidden)load()},300000);
</script></html>
